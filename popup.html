<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE Focus Guard</title>
  <style>
    :root {
      --bg: #080c18; --surface: #111827; --surface2: #1a2235;
      --border: rgba(255,255,255,0.08);
      --green: #10b981; --text: #f0f4ff; --muted: #94a3b8; --dim: #475569;
    }
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background:var(--bg); color:var(--text);
      font-family:'Segoe UI',system-ui,sans-serif;
      width:300px; padding:20px;
    }

    .header {
      display:flex; align-items:center; gap:10px;
      margin-bottom:16px; padding-bottom:14px;
      border-bottom:1px solid var(--border);
    }
    .logo { font-size:24px; }
    .brand { font-size:15px; font-weight:800;
      background:linear-gradient(135deg,var(--green),#34d399);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .version { font-size:11px; color:var(--dim); }

    /* Status Card */
    .status-card {
      border-radius:14px; padding:16px;
      margin-bottom:14px; text-align:center;
      border:1px solid var(--border);
      transition: border-color .3s, background .3s;
    }
    .status-card.locked   { background:rgba(239,68,68,0.07); border-color:rgba(239,68,68,0.2); }
    .status-card.unlocked { background:rgba(16,185,129,0.08); border-color:rgba(16,185,129,0.25); }

    #statusIcon { font-size:28px; margin-bottom:6px; display:block; }
    #statusText { font-size:12px; font-weight:800; letter-spacing:1px; color:var(--muted); }

    .timer {
      font-size:32px; font-weight:900; letter-spacing:2px;
      margin:8px 0 4px; font-variant-numeric:tabular-nums;
    }
    .timer.active  { color:var(--green); text-shadow:0 0 20px rgba(16,185,129,0.3); }
    .timer.expired { color:var(--dim); }

    #timerLabel { font-size:11px; color:var(--dim); }

    /* Stats */
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px; }
    .stat-box {
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:10px 8px; text-align:center;
    }
    .stat-value { font-size:20px; font-weight:900; color:var(--green); }
    .stat-label { font-size:10px; color:var(--dim); margin-top:2px; font-weight:600; }

    /* DB status */
    .db-row {
      display:flex; align-items:center; gap:8px;
      padding:8px 0; border-top:1px solid var(--border);
      margin-bottom:12px;
    }
    .db-dot { width:8px; height:8px; border-radius:50%; background:var(--green); flex-shrink:0; }
    .db-dot.error { background:#ef4444; }
    #dbStatus { font-size:11.5px; color:var(--dim); }

    /* Buttons */
    .btn-group { display:flex; gap:8px; }
    .btn {
      flex:1; padding:11px; border-radius:10px;
      font-size:13px; font-weight:700; cursor:pointer;
      border:none; transition:opacity .15s;
    }
    .btn:hover { opacity:.88; }
    .btn-primary  { background:linear-gradient(135deg,var(--green),#059669); color:#fff; }
    .btn-secondary{ background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo" title="Made by Rudra">🎯</div>
    <div>
      <div class="brand">JEE Focus Guard</div>
      <div class="version">v1.0 · by Rudra</div>
    </div>
  </div>

  <div class="status-card locked" id="statusCard">
    <span id="statusIcon">🔒</span>
    <div id="statusText">SITES LOCKED</div>
    <div class="timer expired" id="timerDisplay">00:00</div>
    <div id="timerLabel">Solve a question to unlock</div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-value" id="statSolved">0</div>
      <div class="stat-label">Solved</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="statAccuracy">0%</div>
      <div class="stat-label">Accuracy</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="statStreak">0</div>
      <div class="stat-label">🔥 Streak</div>
    </div>
  </div>

  <div class="db-row">
    <div class="db-dot" id="dbDot"></div>
    <span id="dbStatus">Loading…</span>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary"   id="btnSolve">🧠 Solve</button>
    <button class="btn btn-secondary" id="btnOptions">⚙️ Options</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
